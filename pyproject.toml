[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skq-experiment"
version = "0.1.0"
description = "Khung thực nghiệm tái lập cho Structured Kernel Quadrature trên dữ liệu bảng."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "psutil>=5.9,<7",
  "matplotlib>=3.8,<4",
  "statsmodels>=0.14,<1",
  "pyahocorasick>=2.1,<3",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0,<4", "catboost>=1.2,<2"]
deep = ["torch>=2.2,<3"]
native = ["fast-enum>=1.3", "faiss-cpu>=1.8; python_version < '3.13'"]
tdbench-kip = ["jax>=0.4", "neural-tangents>=0.6"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
skq = "skq_exp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

